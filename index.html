<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Konrad Olesiewicz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f2f0eb;
            color: #252525;
        }

        main {
            width: 100%;
            max-width: 760px;
            padding: 60px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 20px;
            font-size: 48px;
            line-height: 1.05;
        }

        p {
            margin: 0 0 30px;
            font-size: 20px;
            line-height: 1.6;
            color: #555;
        }

        a {
            display: inline-block;
            padding: 14px 24px;
            color: white;
            background: #252525;
            border-radius: 8px;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            main {
                padding: 35px 25px;
            }

            h1 {
                font-size: 36px;
            }

            p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Konrad Olesiewicz</h1>

        <p>
            Witaj na mojej stronie. To pierwsza wersja witryny
            opublikowanej bezpłatnie przez GitHub Pages.
        </p>

        <a href="mailto:konrad@olesiewicz.pl">Napisz do mnie</a>
    </main>
</body>
</html>
